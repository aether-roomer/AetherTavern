<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>AetherTavern</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2024%2024%22%3E%3Crect%20width=%2224%22%20height=%2224%22%20rx=%225%22%20fill=%22%23e0af68%22/%3E%3Cg%20transform=%22translate(0.643,17.603)%20scale(0.00752,-0.00752)%22%20fill=%22%230d0e12%22%3E%3Cpath%20d=%22M47.43994140625%200%20661.5986328125%201490H2019.20166015625V1201.91845703125H1338.162109375V892.32080078125H1965.6015625V610.3193359375H1338.162109375V288.08154296875H2018.801513671875V0H999.60009765625V1267.438720703125H930.92041015625L436.562255859375%200ZM401.840087890625%20329.35888671875V572.47998046875H1189.681396484375V329.35888671875Z%22/%3E%3Cpath%20transform=%22translate(1653,0)%22%20d=%22M66.07958984375%201201.91845703125V1490H1319.76123046875V1201.91845703125H869.4814453125V0H516.83935546875V1201.91845703125Z%22/%3E%3C/g%3E%3C/svg%3E">
  </head>
  <body>
    <div id="app">
      <!-- Side rail -->
      <nav class="rail" id="rail">
        <button class="rail-btn active" data-tab="chats" title="Chats">
          <!-- speech bubble -->
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.4-4.4A8 8 0 1 1 21 12z"/>
          </svg>
        </button>
        <button class="rail-btn" data-tab="contacts" title="Contacts">
          <!-- single bust silhouette -->
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21a8 8 0 0 1 16 0v1H4z"/>
          </svg>
        </button>
        <button class="rail-btn" data-tab="users" title="User personas">
          <!-- ID card -->
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <circle cx="9" cy="11" r="2"/>
            <path d="M5.5 16.5C6 15 7.5 14 9 14s3 1 3.5 2.5"/>
            <path d="M14 10h5M14 13h4"/>
          </svg>
        </button>
        <button class="rail-btn" data-tab="scenarios" title="Scenarios">
          <!-- mountain landscape -->
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="17.5" cy="6.5" r="2.2"/>
            <path d="M3 19l5-7 4 5 3-3.5L21 19z"/>
          </svg>
        </button>
        <button class="rail-btn" data-tab="libraries" title="Brain libraries">
          <!-- Walnut-style brain: two lobes touching at a single seam, with a
               bold "+" at the top-right (no enclosing box). -->
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 7a2.5 2.5 0 0 0-5.6.7A2 2 0 0 0 5 11a2 2 0 0 0 1.4 3.5A2.5 2.5 0 0 0 12 17z"/>
            <path d="M12 7a2.5 2.5 0 0 1 5.6.7A2 2 0 0 1 19 11a2 2 0 0 1-1.4 3.5A2.5 2.5 0 0 1 12 17z"/>
            <g stroke-width="2.4">
              <line x1="20.5" y1="2" x2="20.5" y2="8"/>
              <line x1="17.5" y1="5" x2="23.5" y2="5"/>
            </g>
          </svg>
        </button>
        <button class="rail-btn rail-generic-only" data-tab="contextPresets" title="Context presets">
          <!-- Document outline with stacked block bars inside, echoing the
               system-prompt-blocks metaphor. -->
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="3" width="16" height="18" rx="2"/>
            <line x1="7.5" y1="8" x2="16.5" y2="8"/>
            <line x1="7.5" y1="12" x2="16.5" y2="12"/>
            <line x1="7.5" y1="16" x2="13" y2="16"/>
          </svg>
        </button>
        <button class="rail-btn" data-tab="settings" title="Settings">
          <!-- sliders -->
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6h8M16 6h4"/>
            <circle cx="14" cy="6" r="2" fill="currentColor"/>
            <path d="M4 12h2M10 12h10"/>
            <circle cx="8" cy="12" r="2" fill="currentColor"/>
            <path d="M4 18h12M20 18h0"/>
            <circle cx="18" cy="18" r="2" fill="currentColor"/>
          </svg>
        </button>
        <div class="rail-spacer"></div>
        <button class="rail-btn" id="sidebar-toggle" title="Collapse sidebar">
          <!-- panel-with-arrow; toggled via JS to flip the chevron -->
          <svg viewBox="0 0 24 24" width="22" height="22" id="sidebar-toggle-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="M9 4v16"/>
            <path d="M14 9l-3 3 3 3"/>
          </svg>
        </button>
        <button class="rail-btn" id="theme-toggle" title="Toggle theme">
          <!-- swapped dynamically by app.js: moon when dark, sun when light -->
          <svg viewBox="0 0 24 24" width="22" height="22" id="theme-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
        </button>
      </nav>

      <!-- Main area: list pane + content pane -->
      <main class="main" id="main">
        <!-- Filled by JS -->
      </main>
    </div>

    <!-- Mobile-only back button: visible only while a detail pane is open
         (body.mobile-detail-open). Hidden on desktop via CSS. Wired in
         app.js to clear the active entity for the current tab. -->
    <button id="mobile-nav-toggle" type="button" aria-label="Back">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 6l-6 6 6 6"/>
      </svg>
    </button>

    <!-- Modal backdrop + container -->
    <div id="modal-root" class="modal-root hidden"></div>

    <!-- Toast container -->
    <div id="toast-root" class="toast-root"></div>

    <!-- Markdown renderer for Generic-mode bubbles. UMD bundle exposes
         `window.marked`; the ES module below reads it as a global. AER
         bubbles keep using the custom highlighter in static/aer_render.js. -->
    <script src="/static/vendor/marked/marked.min.js"></script>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
